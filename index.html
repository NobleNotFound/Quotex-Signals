<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Noble Ai - Signal Bot</title>

	<!-- Google Fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">

	<!-- Styles -->
	<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
	<div class="display">
		<div class="logo">
			<img src="./assets/logo.png" alt="Noble Ai Logo">
		</div>

		<div class="block currency">
			<div class="tit">Currency Pair</div>
			<div class="currency-value">EUR/USD</div>
			<div class="currency-container"></div>
		</div>

		<div class="block forecast">
			<div class="tit">Forecast</div>
			<div class="value">Loading...</div>
		</div>

		<div class="block set-time">
			<div class="tit">Time Interval</div>
			<div class="time-val">1 Min</div>
			<div class="set-time-items"></div>
		</div>

		<button class="btn action"><span class="text">Generate Signal</span></button>
	</div>
</div>

<script src="script.js"></script>
</body>
</html>
