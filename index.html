<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Signal Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="currency">
            <span class="currency-label">Currency Pair:</span>
            <span class="currency-value">EUR/USD</span>
            <div class="currency-container"></div>
        </div>
        <div class="set-time">
            <span>Time Interval:</span>
            <span class="time-val">1 Min</span>
            <div class="set-time-items"></div>
        </div>
        <div class="forecast">
            <span>Forecast:</span>
            <div class="value">Loading...</div>
        </div>
        <button class="btn action">Start Signal</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
